name: Validate DBSJP Revision Hub
on:
  push:
    branches:
      - v4-16-five-review-cycles
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py courses engine tests
      - name: Run all regression tests
        run: python -m pytest -q
